[workspace]
resolver = "2"
members = [
    "desktop-gpui",
    "app-daemon",
    "rqbit-protocol",
    "rqbit-ui",
    "web-gpui",
]

[workspace.package]
version = "9.0.1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = false
lto = "thin"

[profile.release-github]
inherits = "release"
lto = false

[profile.release-debug]
inherits = "release"
debug = true

[workspace.dependencies]
# Internal crates - keys are import names used in source code, package is the actual crate name
rqbit-protocol = { path = "rqbit-protocol", version = "9.0.1" }
rqbit-ui = { path = "rqbit-ui", version = "9.0.1" }

# rqbit (librqbit) comes from crates.io. Local modifications are kept as a
# cargo-patch-crate patch in patches/ - run `cargo patch-crate` before the
# first build (see AGENTS.md).
librqbit = { version = "=9.0.1", default-features = false }
librqbit-core = { version = "9.0.1", default-features = false }

# External crates
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
bytes = "1"
clap = "4"
directories = "6"
futures = "0.3"
gethostname = "1"
http = "1"
librqbit-dualstack-sockets = "0.7"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
notify = "8"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false }
serde = "1"
serde_derive = "1"
serde_json = "1"
serde_with = "3"
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
url = { version = "2", default-features = false }
walkdir = "2"

# Crates patched locally via cargo-patch-crate (see patches/). After cloning,
# run `cargo patch-crate` once to materialize them into target/patch/ before
# building.
[workspace.metadata.patch]
crates = ["librqbit"]

[patch.crates-io]
librqbit = { path = "./target/patch/librqbit-9.0.1" }
