[package]
name = "desktop-gpui"
version.workspace = true
edition = "2024"
description = "Native desktop for rqbit"
license = "MIT"
repository = "https://github.com/anthropics/rqbit"
publish = false

[package.metadata.bundle]
name = "rqbit-gpui-desktop"
identifier = "com.rqbit.gpui-desktop"
icon = ["icons/icon.ico", "icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns"]
version = "1.0.0"
short_description = "Native desktop for rqbit"
long_description = """https://github.com/aleksplus/rqbit"""

# Built in CI with:
#   cargo deb -p desktop-gpui --no-build --profile release-github --target x86_64-unknown-linux-gnu
# The `target/release/...` asset prefix is rewritten by cargo-deb to
# target/<triple>/<profile>/ for the selected --target/--profile.
[package.metadata.deb]
section = "net"
priority = "optional"
extended-description = "rqbit desktop client: native GPUI interface plus an embedded web UI served by the built-in daemon."
# Hard-linked libs beyond libc/libssl are declared explicitly (dpkg-shlibdeps
# adds those when available); dlopen'd ones need to be listed here.
depends = "libfontconfig1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0"
recommends = "libvulkan1, xdg-utils"
assets = [
    ["target/release/desktop-gpui", "usr/bin/desktop-gpui", "755"],
    ["assets/rqbit-gpui-desktop.desktop", "usr/share/applications/rqbit-gpui-desktop.desktop", "644"],
    ["icons/32x32.png", "usr/share/icons/hicolor/32x32/apps/rqbit-gpui-desktop.png", "644"],
    ["icons/128x128.png", "usr/share/icons/hicolor/128x128/apps/rqbit-gpui-desktop.png", "644"],
    ["icons/128x128@2x.png", "usr/share/icons/hicolor/256x256/apps/rqbit-gpui-desktop.png", "644"],
]

[dependencies]
# gpui-kit pins the matching GPUI release (gpui-pre); the aliases below must
# stay on the same exact versions as gpui-kit or the GPUI types would split.
gpui-kit = "0.7.1"
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }
url.workspace = true
async-trait = { workspace = true }
# The desktop app bundles the daemon's server (WS protocol + embedded web
# client) so its own session is reachable from the browser — one librqbit
# session serves both the native UI and the web view.
app-daemon = { path = "../app-daemon" }
axum = { workspace = true }
rqbit-protocol = { workspace = true, features = ["librqbit"] }
rqbit-ui = { workspace = true }
librqbit = { workspace = true, features = [
    "tracing-subscriber-utils",
    "http-api",
    "upnp-serve-adapter",
    "prometheus",
    "default-tls"
] }
librqbit-core = { workspace = true, features = ["sha1-crypto-hash"] }
notify = { workspace = true }
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["json", "query"] }
base64 = { workspace = true }
http = { workspace = true }
directories = { workspace = true }
futures = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
parking_lot = { workspace = true }
gethostname = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
librqbit-dualstack-sockets = { workspace = true }
walkdir = { workspace = true }
ring = "0.17"
hex = "0.4"
toml = "0.8"
# Cross-platform "open folder / URL" (macOS `open`, Linux `xdg-open`, Windows).
# Already a transitive dep of gpui-pre-linux; declared here for `DesktopHost::open_folder`.
open = "5"

[dev-dependencies]
# Headless UI tests (gpui_kit::test) need the kit's test-support feature.
gpui-kit = { version = "0.7.1", features = ["test-support"] }

[features]
default = []
disable-upload = ["librqbit/disable-upload"]