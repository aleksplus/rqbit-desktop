name: Run tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-rust-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The GPUI dependency (gpui-pre >= 0.3.10) calls std::hint::cold_path,
        # stabilized in Rust 1.98 — older toolchains can't compile it, and the
        # crate has no feature to turn the profiler module off.
        rust_version: ["1.98", "1.99"]
    steps:
      - name: rustup toolchain install ${{ matrix.rust_version }}
        run: |
          rustup toolchain install ${{ matrix.rust_version }}

      - uses: actions/checkout@v4

      - run: rustup override set ${{ matrix.rust_version }}

      - run: rustup component add rustfmt clippy

      # desktop-gpui is a default workspace member, so even `cargo check`
      # needs the GPUI Linux stack on ubuntu.
      - name: Install GPUI Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libssl-dev

      - name: Apply librqbit patch
        run: |
          cargo install patch-crate --locked
          # --force re-applies onto a pristine copy: rust-cache can restore a
          # target/ dir containing a stale or partial target/patch/, and the
          # plain invocation then skips and leaves cargo's [patch.crates-io]
          # path pointing at an unusable source.
          cargo patch-crate --force

      - name: cargo check
        run: cargo check

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy check
        run: cargo clippy --all-targets

  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1

      - name: Install GPUI Linux dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libssl-dev

      # Runner images no longer ship ffmpeg; the artwork tests need it to
      # encode fixture videos (app-daemon/tests/artwork.rs `seeded_video`).
      - name: Install ffmpeg
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg
        if: ${{ matrix.os == 'macos-latest' }}
        run: brew install ffmpeg

      - name: Install ffmpeg
        if: ${{ matrix.os == 'windows-latest' }}
        run: choco install ffmpeg -y --no-progress

      - name: Apply librqbit patch
        run: |
          cargo install patch-crate --locked
          # --force re-applies onto a pristine copy: rust-cache restores the
          # whole target/ dir (incl. target/patch/), and the plain invocation
          # then skips, leaving a stale or partial patched source behind.
          cargo patch-crate --force

      - name: Run tests
        if: ${{ matrix.os == 'windows-latest' }}
        run: cargo test --workspace

      - name: Run tests
        if: ${{ matrix.os == 'macos-latest' }}
        run: ulimit -n unlimited && cargo test --workspace

      - name: Run tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: cargo test
