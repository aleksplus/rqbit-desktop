name: Release binaries for OSX

on:
  push:
    tags:
      - "*.*.*"

env:
  CARGO_TERM_COLOR: always
  # Must match the `wasm-bindgen` crate version in Cargo.lock (see Makefile).
  WASM_BINDGEN_VERSION: 0.2.127

# Needed by softprops/action-gh-release: generate_release_notes requires
# write access to contents, and the default GITHUB_TOKEN is read-only.
permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # librqbit is used from crates.io with local patches (cargo-patch-crate):
      # materialize patched sources into target/patch/ before any build.
      - name: Apply librqbit patch
        run: |
          cargo install patch-crate --locked
          cargo patch-crate

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin

      # The GPUI web stack needs nightly: gpui-pre-web's `multithreaded`
      # feature pulls wasm_thread, which uses `#![feature(...)]` with no
      # opt-out (see Makefile, WASM_TOOLCHAIN).
      - name: Install nightly toolchain for the wasm web client
        run: rustup toolchain install nightly --profile minimal --target wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"

      # The browser client is embedded into the desktop binary at compile
      # time (app-daemon/build.rs), so this must run before desktop-gpui.
      - name: Build web client (wasm payload)
        run: |
          rustup run nightly cargo build -p web-gpui --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --out-dir web-gpui/dist/pkg target/wasm32-unknown-unknown/release/web_gpui.wasm

      - name: Build release OSX aarch64 app (desktop-gpui)
        run: cargo build -p desktop-gpui --profile release-github --target aarch64-apple-darwin

      # Package the binary as a proper .app bundle (name, identifier and icon
      # match [package.metadata.bundle] in desktop-gpui/Cargo.toml) and ship
      # it as a compressed DMG. Ad-hoc signing: aarch64 macOS refuses to run
      # unsigned binaries, and the signature must cover the whole bundle.
      - name: Package arm64 app bundle and DMG
        run: |
          APP_NAME=rqbit-gpui-desktop
          VERSION="${GITHUB_REF_NAME#v}"
          APP="target/artifacts/${APP_NAME}.app"

          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/aarch64-apple-darwin/release-github/desktop-gpui "$APP/Contents/MacOS/${APP_NAME}"
          cp desktop-gpui/icons/icon.icns "$APP/Contents/Resources/"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>${APP_NAME}</string>
            <key>CFBundleDisplayName</key><string>rqbit</string>
            <key>CFBundleExecutable</key><string>${APP_NAME}</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>CFBundleIdentifier</key><string>com.rqbit.gpui-desktop</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          codesign --force --sign - "$APP"

          hdiutil create -volname "rqbit" -srcfolder "$APP" -ov -format UDZO \
            target/artifacts/desktop-gpui-osx-aarch64.dmg

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: true
          files: |
            target/artifacts/desktop-gpui-osx-aarch64.dmg
