name: Release desktop (.deb) for Linux

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"

env:
  CARGO_TERM_COLOR: always
  # Must match the `wasm-bindgen` crate version in Cargo.lock (see Makefile).
  WASM_BINDGEN_VERSION: 0.2.127

# Needed by softprops/action-gh-release: generate_release_notes requires
# write access to contents, and the default GITHUB_TOKEN is read-only.
permissions:
  contents: write

jobs:
  release-linux-deb:
    # 24.04 pins glibc 2.39: the binary (and deb deps) target Ubuntu 24.04+ /
    # Debian 13+. Don't bump to a newer image without reconsidering that floor.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # librqbit is used from crates.io with local patches (cargo-patch-crate):
      # materialize patched sources into target/patch/ before any build.
      - name: Apply librqbit patch
        run: |
          cargo install patch-crate --locked
          cargo patch-crate

      # The GPUI Linux stack is needed by desktop-gpui: fontconfig/xkbcommon/
      # wayland (linked or dlopen'd by gpui-pre-platform) and openssl (librqbit
      # default-tls on Linux).
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libssl-dev

      # The GPUI web stack needs nightly: gpui-pre-web's `multithreaded`
      # feature pulls wasm_thread, which uses `#![feature(...)]` with no
      # opt-out (see Makefile, WASM_TOOLCHAIN).
      - name: Install nightly toolchain for the wasm web client
        run: rustup toolchain install nightly --profile minimal --target wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"

      # The browser client is embedded into the desktop binary at compile
      # time (app-daemon/build.rs), so this must run before desktop-gpui.
      - name: Build web client (wasm payload)
        run: |
          rustup run nightly cargo build -p web-gpui --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --out-dir web-gpui/dist/pkg target/wasm32-unknown-unknown/release/web_gpui.wasm

      - name: Build desktop (desktop-gpui)
        run: cargo build -p desktop-gpui --profile release-github --target x86_64-unknown-linux-gnu

      - name: Package .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb -p desktop-gpui --no-build --profile release-github --target x86_64-unknown-linux-gnu

      - name: Locate .deb
        id: deb
        run: |
          DEB=$(find target -type f -name '*.deb' | head -n1)
          echo "Building from tag ${GITHUB_REF_NAME:-<no tag>}, deb: $DEB"
          echo "path=$DEB" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        if: ${{ github.ref_type == 'tag' }}
        with:
          generate_release_notes: true
          draft: true
          files: ${{ steps.deb.outputs.path }}
